name: Build macOS release binary

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install SDL3 dependencies via Homebrew
        run: |
          brew install sdl3 sdl3_ttf sdl3_image

      - name: Build macOS binary
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5

          make clean
          make vdp
          FORCE=1 cargo build -r --target=aarch64-apple-darwin
          cp ./target/aarch64-apple-darwin/release/fab-agon-emulator ./fab-agon-emulator

          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          DIST_DIR=fab-agon-emulator-v${VERSION}-macos-arm64

          rm -rf $DIST_DIR
          mkdir $DIST_DIR
          cp ./fab-agon-emulator $DIST_DIR
          dist_scripts/bundle-macos-sdl3.sh $DIST_DIR/fab-agon-emulator
          cp -r ./firmware $DIST_DIR
          cp LICENSE README.md $DIST_DIR
          mkdir $DIST_DIR/THIRD-PARTY-LICENSES
          cp dist_scripts/THIRD-PARTY-LICENSES/*.txt $DIST_DIR/THIRD-PARTY-LICENSES/
          mkdir $DIST_DIR/sdcard
          cp -r sdcard/* $DIST_DIR/sdcard/
          zip ${DIST_DIR}.zip -r $DIST_DIR/*

          echo "DIST_ZIP=${DIST_DIR}.zip" >> $GITHUB_ENV

      - name: Upload artifact to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST_ZIP }}

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_ZIP }}
          path: ${{ env.DIST_ZIP }}
